# Fly.io configuration for Souk Siege. Deploy from this folder with:
#
#     flyctl deploy
#
# One machine only: rooms live in the server's memory, so a second machine
# would be a second, separate town that players could not see each other in.
# See https://fly.io/docs/reference/configuration/ for the options.

app = 'souk-siege'
primary_region = 'syd'

[env]
  # no persistent disk here, so accounts stay off (as on Render); attach a
  # volume, point DATA_DIR at it and set this to "1" to switch them on
  ACCOUNTS = '0'

[http_service]
  internal_port = 8080
  force_https = true
  # keep the one machine awake so nobody waits on a cold start to join
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
